name: Windows Desktop Build (Rust + Tailwind CSS)
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Verify repository layout
        shell: pwsh
        run: |
          if (!(Test-Path 'web/package.json')) { throw 'Missing web/package.json at repository root' }
          if (!(Test-Path 'apps/desktop/tauri.conf.json')) { throw 'Missing Tauri config' }
      - name: Install Tailwind build dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build offline UI assets
        working-directory: web
        run: npm run build
      - name: Verify static UI assets
        shell: pwsh
        run: |
          foreach ($file in @('web/dist/index.html','web/dist/app.js','web/dist/styles.css')) { if (!(Test-Path $file)) { throw "Missing $file" } }
      - name: Test Rust core
        run: cargo test -p illustrator-document -p illustrator-editor
      - name: Build portable Windows executable
        run: cargo build --release -p illustrator-desktop
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/illustrator-desktop.exe dist/IllustratorRS.exe
          Compress-Archive -Path dist/* -DestinationPath IllustratorRS-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IllustratorRS-Windows-x64
          path: IllustratorRS-Windows-x64.zip
          if-no-files-found: error
