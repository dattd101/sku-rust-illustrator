name: Windows Desktop Build (Next.js 15 + Tauri 2)
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: npm install --prefix web --no-audit --no-fund
      - name: Build Next.js static UI
        run: npm run build --prefix web
      - name: Test Rust core
        run: cargo test -p illustrator-document -p illustrator-editor
      - name: Build Windows desktop executable
        run: cargo build --release -p illustrator-desktop
      - name: Package portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/illustrator-desktop.exe dist/IllustratorRS.exe
          Compress-Archive -Path dist/* -DestinationPath IllustratorRS-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IllustratorRS-Windows-x64
          path: IllustratorRS-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
